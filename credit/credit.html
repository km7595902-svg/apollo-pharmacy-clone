<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apollo SBI Card Select</title>

    <link rel="stylesheet" href="credit.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <!-- LOGO -->

        <div class="logo">

             <img src="https://images.apollo247.in/images/creditcardhub/logo.svg?tr=q-80,w-100,dpr-2,c-at_max" alt="">
        </div>


        <!-- MENU -->

        <nav class="nav-menu">

            <a href="#home">
                Home
            </a>

            <a href="#features">
                Features &amp; Benefits
            </a>

            <a href="#calculator">
                Calculator
            </a>

            <a href="#faqs">
                FAQs
            </a>

            <a href="#videos">
                How to Videos
            </a>

        </nav>


        <!-- APPLY BUTTON -->

        <button class="apply-btn">
            Apply Now
        </button>

    </header>



    <!-- ================= HERO ================= -->

    <main>

        <section class="hero" id="home">

            <div class="hero-container">


                <!-- LEFT CONTENT -->

                <div class="hero-content">

                    <p class="introducing">
                        INTRODUCING
                    </p>


                    <h1>
                        Apollo SBI Card
                        <span>SELECT</span>
                    </h1>


                    <div class="line"></div>


                    <h2>
                        India's
                        <strong>Health First</strong>
                        Credit Card
                    </h2>


                    <div class="line"></div>


                    <p class="interested">
                        151,053 INTERESTED
                    </p>

                </div>



                <!-- RIGHT IMAGE -->

                <div class="hero-image">

                    <img
                        src="https://images.apollo247.in/images/creditcardhub/hero.webp"
                        alt="Apollo SBI Credit Card">

                </div>


            </div>

        </section>



        <!-- ================= FEATURES ================= -->
         <section class="card-video-section">

    <div class="card-video">

        <video
            autoplay
            muted
            loop
            playsinline
            controls>
            
            <source src="https://images.apollo247.in/videos/Card_launch.mp4
" type="video/mp4">

            Your browser does not support the video tag.
        </video>

    </div>

</section>

    </main>


</body>

</html>
